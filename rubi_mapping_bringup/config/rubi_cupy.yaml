/elevation_mapping_node:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    corrected_map_frame: map
    resolution: 0.05
    map_length: 8.0
    allow_latest_tf_fallback: true        # false -> true
    use_initializer_at_start: false
    enable_drift_compensation: false
    enable_overlap_clearance: false
    # Keep the upstream height estimator as the initial baseline.
    enable_edge_sharpen: false
    subscribers:
      rubi_lidar:
        topic_name: /livox/lidar_PointCloud2
        data_type: pointcloud
    publishers:
      elevation_map_raw:
        layers: [elevation, variance]
        basic_layers: [elevation]
        fps: 5.0
